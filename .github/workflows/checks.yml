name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pytest sqlalchemy
      - name: Version pin lockstep
        run: python -m pytest test -q
      - name: Extension unit tests (adapters and business rules)
        run: python -m pytest refugee-extension/tests -q
